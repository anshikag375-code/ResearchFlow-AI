
[project]
name = "multi-agent-ai-research"
version = "0.1.0"
description = "Multi-agent AI research application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "langchain>=0.3.20,<0.4.0",
    "langchain-community==0.3.5",
    "langchain-groq",
    "langchain-tavily==0.2.0",
    "langchain-together==0.2.0",
    "langgraph==0.2.45",
    "ddgs",
    "python-dotenv==1.0.1",
    "streamlit==1.39.0",
    "tavily-python==0.5.0",
    "together==1.3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
